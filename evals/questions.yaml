# =====================================================================
# Questions-tests de l'agent text-to-SQL.
# Chaque question a une requête SQL DE RÉFÉRENCE, écrite et vérifiée à la main.
# L'évaluation compare le résultat de l'agent à celui de cette requête :
# les chiffres attendus ne sont donc jamais écrits en dur, ils sont recalculés.
# =====================================================================

- id: q01
  question: "Combien de clients y a-t-il dans le portefeuille ?"
  reference_sql: "SELECT COUNT(*) FROM marts.v_portefeuille"

- id: q02
  question: "Quel est le taux de défaut global du portefeuille, en pourcentage ?"
  reference_sql: "SELECT ROUND(100.0 * AVG(is_default), 2) FROM marts.v_portefeuille"

- id: q03
  question: "Combien de clients ont fait défaut ?"
  reference_sql: "SELECT SUM(is_default) FROM marts.v_portefeuille"

- id: q04
  question: "Combien de clients y a-t-il dans chaque classe de risque ?"
  reference_sql: "SELECT risk_class, COUNT(*) FROM marts.v_portefeuille GROUP BY risk_class ORDER BY risk_class"

- id: q05
  question: "Quel est le taux de défaut des clients de moins de 30 ans, en pourcentage ?"
  reference_sql: "SELECT ROUND(100.0 * AVG(is_default), 2) FROM marts.v_portefeuille WHERE age_years < 30"

- id: q06
  question: "Quel est le revenu moyen des clients ?"
  reference_sql: "SELECT ROUND(AVG(income)) FROM marts.v_portefeuille"

- id: q07
  question: "Combien y a-t-il de femmes et combien d'hommes ?"
  reference_sql: "SELECT gender, COUNT(*) FROM marts.v_portefeuille WHERE gender IS NOT NULL GROUP BY gender ORDER BY gender"

- id: q08
  question: "Quel est le taux de défaut des femmes et celui des hommes, en pourcentage ?"
  reference_sql: "SELECT gender, ROUND(100.0 * AVG(is_default), 2) FROM marts.v_portefeuille WHERE gender IS NOT NULL GROUP BY gender ORDER BY gender"

- id: q09
  question: "Quel est le montant moyen de crédit par type de contrat ?"
  reference_sql: "SELECT contract_type, ROUND(AVG(credit_amount)) FROM marts.v_portefeuille GROUP BY contract_type ORDER BY contract_type"

- id: q10
  question: "Quel est le taux de défaut par niveau d'études, en pourcentage ?"
  reference_sql: "SELECT education, ROUND(100.0 * AVG(is_default), 2) FROM marts.v_portefeuille GROUP BY education ORDER BY education"

- id: q11
  question: "Combien de clients sont dans la classe de risque E ?"
  reference_sql: "SELECT COUNT(*) FROM marts.v_portefeuille WHERE risk_class = 'E'"

- id: q12
  question: "Quelle est la probabilité de défaut moyenne du portefeuille, en pourcentage ?"
  reference_sql: "SELECT ROUND(100.0 * AVG(pd), 2) FROM marts.v_portefeuille"

- id: q13
  question: "Quelle est la perte attendue totale du portefeuille ?"
  reference_sql: "SELECT ROUND(SUM(expected_loss)) FROM marts.v_portefeuille"

- id: q14
  question: "Quel est l'âge moyen des clients qui ont fait défaut ?"
  reference_sql: "SELECT ROUND(AVG(age_years), 1) FROM marts.v_portefeuille WHERE is_default = 1"

